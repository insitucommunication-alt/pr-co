<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Vers une culture de la coopération renforcée</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root{
      /* --- Brand (MAIF) --- */
      --maif-red-logo:#fc0d1a;
      --maif-black:#000000;
      --maif-grey:#58595b;

      /* --- UI neutrals --- */
      --bg-page:#f6f6f6;
      --bg-surface:#ffffff;
      --bg-subtle:#f2f2f2;
      --text-main:#1a1a1a;
      --text-muted:#6b6b6b;
      --border:#e3e3e3;
      --border-strong:#d6d6d6;

      /* --- UI red accessible --- */
      --maif-red-ui:#d32f2f;

      /* --- Radii --- */
      --radius-sm:10px;
      --radius-md:12px;
      --radius-lg:14px;

      /* --- Focus --- */
      --focus: 0 0 0 3px rgba(211,47,47,.18);

      /* --- Axes --- */
      --axe1:#578fa6;
      --axe2:#b88ba7;
      --axe3:#7FB39A;
      --axe4:#D1A06A;
    }

    html,body{ height:100%; }
    body{
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:var(--bg-page);
      color:var(--text-main);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    a,button,input{ -webkit-tap-highlight-color: transparent; }
    button:focus-visible,
    a:focus-visible,
    input:focus-visible{
      outline:none;
      box-shadow:var(--focus);
      border-radius:10px;
    }
    @media (prefers-reduced-motion: reduce){
      *{ transition:none !important; scroll-behavior:auto !important; }
    }

    .container-maif{
      max-width: 1320px;
      margin: 0 auto;
      padding: 0 20px;
    }
    @media (min-width: 768px){
      .container-maif{ padding: 0 28px; }
    }

    header{ background:var(--bg-surface); }
    .topbar{ background:var(--bg-surface); border-bottom:1px solid var(--border); }
    .subbar{ background:var(--bg-subtle); border-bottom:1px solid var(--border); }

    .brand-logo{ height:44px; width:auto; display:block; }

    .main-nav{ display:flex; align-items:center; gap:26px; }
    .main-nav-item{
      position:relative;
      padding:18px 0;
      font-size:15px;
      font-weight:800;
      color:var(--text-main);
      background:transparent;
      border:none;
      cursor:pointer;
      letter-spacing:-0.01em;
    }
    .main-nav-item:hover{ color:#000; }
    .main-nav-item.active{ color:var(--maif-red-ui); }
    .main-nav-item.active::after{
      content:"";
      position:absolute;
      left:0; right:0;
      bottom:10px;
      height:2px;
      background:var(--maif-red-ui);
      border-radius:2px;
    }

    .subnav{
      display:flex;
      align-items:center;
      gap:22px;
      overflow-x:auto;
      scrollbar-width:none;
    }
    .subnav::-webkit-scrollbar{ display:none; }
    .subnav-item{
      position:relative;
      padding:14px 0;
      font-size:13px;
      font-weight:800;
      color:var(--text-main);
      background:transparent;
      border:none;
      cursor:pointer;
      white-space:nowrap;
    }
    .subnav-item:hover{ color:#000; }
    .subnav-item.active{ color:var(--maif-red-ui); }
    .subnav-item.active::after{
      content:"";
      position:absolute;
      left:0; right:0;
      bottom:-1px;
      height:2px;
      background:var(--maif-red-ui);
      border-radius:2px;
    }

    .icon-btn{
      width:40px; height:40px;
      border-radius:9999px;
      display:flex; align-items:center; justify-content:center;
      border:1px solid transparent;
      background:transparent;
      transition: background .15s ease, border-color .15s ease;
    }
    .icon-btn:hover{
      background:rgba(0,0,0,.04);
      border-color:rgba(0,0,0,.06);
    }
    .icon-red{ color:var(--maif-red-ui); }

    .search-wrap{ display:flex; align-items:center; gap:10px; }
    .search-shell{
      width:0;
      opacity:0;
      overflow:hidden;
      transition:width .2s ease, opacity .15s ease;
    }
    .search-shell.open{ width:320px; opacity:1; }
    @media (max-width: 768px){ .search-shell.open{ width:220px; } }
    .search-input{
      width:100%;
      height:38px;
      border-radius:var(--radius-sm);
      border:1px solid var(--border-strong);
      background:#fff;
      padding:0 12px;
      font-size:13px;
      font-weight:800;
      color:var(--text-main);
    }
    .search-input::placeholder{ color:#8a8a8a; font-weight:800; }

    .hero-title{
      margin:26px 0 10px;
      font-size:30px;
      line-height:1.15;
      letter-spacing:-0.02em;
    }
    .hero-light{ font-weight:300; color:var(--text-main); }
    .hero-strong{ font-weight:900; color:var(--maif-red-ui); }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:10px;
      padding:8px 12px;
      border-radius:9999px;
      border:1px solid var(--border);
      background:#fff;
      font-size:12px;
      font-weight:900;
      color:#444;
      max-width: 100%;
    }
    .chip .chip-text{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width: 820px;
    }

    /* Cards */
    .card{
      background:var(--bg-surface);
      border:1px solid var(--border);
      border-radius:var(--radius-md);
      padding:18px;
      min-height:190px;
      display:flex;
      flex-direction:column;
      cursor:pointer;
      box-shadow:0 1px 1px rgba(0,0,0,0.03);
      transition: box-shadow .18s ease, border-color .18s ease;
      position:relative;
    }
    .card::before{
      content:"";
      position:absolute;
      left:0; top:0; bottom:0;
      width:4px;
      border-top-left-radius:var(--radius-md);
      border-bottom-left-radius:var(--radius-md);
      background: var(--axe, var(--maif-grey));
      opacity:.9;
    }
    .card:hover{
      border-color:var(--border-strong);
      box-shadow:0 8px 20px rgba(0,0,0,0.06);
    }

    .axe-badge{
      font-size:10px;
      font-weight:900;
      text-transform:uppercase;
      letter-spacing:.06em;
      padding:4px 10px;
      border-radius:9999px;
      background:#fff;
      border:1px solid var(--border);
      color:var(--text-main);
    }
    .meta-id{
      font-size:10px;
      font-weight:900;
      color:#9b9b9b;
    }

    .theme-label{
      font-size:11px;
      font-weight:900;
      color:var(--text-muted);
      text-transform:uppercase;
      letter-spacing:.03em;
      margin-top:12px;
      margin-bottom:4px;
      display:block;
      width:100%;
      text-align:left;
    }
    .theme-label:hover{ color:#000; text-decoration: underline; text-underline-offset: 2px; }

    .title-clamp{
      display:-webkit-box;
      -webkit-line-clamp:3;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .pilot-name{ font-size:12px; font-weight:900; color:#444; }
    .progress-track{
      height:6px;
      background:#ededed;
      width:100%;
      border-radius:9999px;
      margin-top:10px;
      overflow:hidden;
      border:1px solid #e6e6e6;
    }
    .progress-bar{
      height:100%;
      border-radius:9999px;
      background: var(--axe, var(--maif-grey));
      transition: width .4s ease;
    }

    /* Pistes */
    .panel{
      background:var(--bg-surface);
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      padding:22px 22px;
      box-shadow:0 1px 1px rgba(0,0,0,0.03);
    }
    @media (min-width:768px){ .panel{ padding:26px 28px; } }

    /* Modal */
    #backdrop{
      background: rgba(0,0,0,.45);
      backdrop-filter: blur(2px);
    }
    .modal{
      background:var(--bg-surface);
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:0 18px 50px rgba(0,0,0,.22);
    }
    .modal-close{
      width:36px;height:36px;
      border-radius:9999px;
      background:#f3f3f3;
      border:1px solid #e7e7e7;
      display:flex;align-items:center;justify-content:center;
      font-weight:900;
      cursor:pointer;
    }
    .modal-close:hover{ background:#ededed; }

    .modal-notes{
      background:#f5f5f5;
      border:1px solid #e9e9e9;
      border-radius:var(--radius-md);
      padding:14px 14px;
    }
    .notes-body{
      margin-top:10px;
      min-height:170px; /* espace "assez grand" */
      background:#fff;
      border:1px solid #e7e7e7;
      border-radius:12px;
      padding:12px 12px;
      white-space:pre-line;   /* respecte les retours à la ligne */
      word-break:break-word;
      line-height:1.55;
    }

    .desc-placeholder{ color:#b0b0b0; }
  </style>
</head>

<body>

  <header class="sticky top-0 z-50">
    <div class="topbar">
      <div class="container-maif">
        <div class="flex items-center justify-between gap-6">
          <div class="flex items-center gap-7 min-w-0">
            <a href="#" class="shrink-0" aria-label="Accueil">
              <img class="brand-logo" src="https://static.maif.fr/resources/img/logo-maif.svg" alt="MAIF">
            </a>

            <nav class="main-nav" aria-label="Navigation principale">
              <button onclick="switchView('grid')" id="btn-grid" class="main-nav-item active">Préconisations</button>
              <button onclick="switchView('piste')" id="btn-piste" class="main-nav-item">Tableau de bord</button>
            </nav>
          </div>

          <div class="hidden md:block"></div>
        </div>
      </div>
    </div>

    <div class="subbar">
      <div class="container-maif">
        <div class="flex items-center justify-between gap-6">

          <div class="flex items-center gap-5 min-w-0">
            <button class="icon-btn icon-red" type="button" onclick="filterByAxe('all')" aria-label="Tous les axes">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M3 10.5L12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1v-10.5z"/>
              </svg>
            </button>

            <div class="subnav" aria-label="Filtres axes">
              <button class="subnav-item active" data-axe="all" onclick="filterByAxe('all')">Tous les axes</button>
              <button class="subnav-item" data-axe="1" onclick="filterByAxe(1)">Les fondamentaux</button>
              <button class="subnav-item" data-axe="2" onclick="filterByAxe(2)">Aide de la communauté</button>
              <button class="subnav-item" data-axe="3" onclick="filterByAxe(3)">J'aide la communauté</button>
              <button class="subnav-item" data-axe="4" onclick="filterByAxe(4)">Le collectif</button>
            </div>
          </div>

          <div class="search-wrap">
            <div id="searchShell" class="search-shell">
              <input id="mainSearch" oninput="filterAll()" class="search-input" type="text" placeholder="Rechercher...">
            </div>

            <button class="icon-btn" type="button" onclick="toggleSearch()" aria-label="Rechercher">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                <path d="M21 21l-5.5-5.5m2-5A7 7 0 1 1 3 10a7 7 0 0 1 14 0z"/>
              </svg>
            </button>
          </div>

        </div>
      </div>
    </div>
  </header>

  <main class="container-maif pb-7 md:pb-10">
    <h1 class="hero-title">
      <span class="hero-light">Vers une culture de la </span>
      <span class="hero-strong">coopération renforcée</span>
    </h1>

    <div id="activeThemeChipWrap" class="hidden mb-5">
      <button type="button" class="chip" onclick="clearThemeFilter()" title="Retirer le filtre thématique">
        <span>Thématique :</span>
        <span id="activeThemeText" class="chip-text"></span>
        <span aria-hidden="true">✕</span>
      </button>
    </div>

    <section id="view-grid">
      <div id="projectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
    </section>

    <section id="view-piste" class="hidden">
      <div id="pistesContainer" class="space-y-5"></div>
    </section>
  </main>

  <!-- MODAL (simplifiée) -->
  <div id="backdrop" class="fixed inset-0 z-[100] hidden items-center justify-center p-4">
    <div class="modal max-w-2xl w-full p-7 md:p-8">
      <div class="flex justify-between items-start mb-6">
        <div class="min-w-0">
          <!-- 1) Numéro -->
          <span id="mNum"
                class="inline-flex text-[10px] font-black text-[#6b6b6b] px-2 py-1 rounded border border-[#e3e3e3] bg-white">
            #00
          </span>

          <!-- 2) Préconisation (plus petit) -->
          <h2 id="mTitle" class="text-[18px] md:text-[20px] font-black mt-4 leading-snug text-black">
            Préconisation
          </h2>
        </div>

        <button onclick="closeModal()" class="modal-close" aria-label="Fermer">✕</button>
      </div>

      <!-- 3) Zone Avancées (grand espace) -->
      <div class="modal-notes mb-7">
        <div class="flex items-end justify-between gap-4">
          <span class="text-[10px] uppercase font-black tracking-[0.10em] text-[#7a7a7a]">Avancées</span>
          <span class="text-[10px] font-black text-[#9b9b9b]">À remplir dans le code</span>
        </div>
        <div id="mAdvances" class="notes-body text-[13px] font-bold text-[#3f3f3f]"></div>
      </div>

      <!-- 4) Barre de progression -->
      <div class="pt-5 border-t border-[#ededed]">
        <div class="flex justify-between items-end mb-4">
          <span class="text-[10px] uppercase font-black tracking-[0.10em] text-[#7a7a7a]">Mise en œuvre</span>
          <span id="mProgressText" class="text-2xl font-black text-[#111]">0%</span>
        </div>

        <div class="progress-track">
          <div id="mProgressBar" class="progress-bar" style="width:0%"></div>
        </div>
      </div>
    </div>
  </div>

      const n = parseInt(v, 10);
      if (!Number.isFinite(n)) return 0;
      return Math.max(0, Math.min(100, n));

      const v = PROGRESS_BY_PRECO[displayId];

    let projects = [];

    /* FORMAT : Prénom NOM */
    function formatName(rawName){
      if(!rawName || String(rawName).trim() === "") return "À DÉFINIR";
      const trimmed = String(rawName).trim().replace(/\s+/g, " ");

      if(trimmed.toUpperCase() === "À DÉFINIR") return "À DÉFINIR";
      if(/tribu/i.test(trimmed)) return trimmed;

      const parts = trimmed.split(" ");
      if(parts.length === 1){
        const w = parts[0].toLowerCase();
        return w.charAt(0).toUpperCase() + w.slice(1);
      }

      const lastName = parts.pop().toUpperCase();
      const particles = new Set(["de","du","des","d","le","la","les","van","von","der","den","del","della","da","di"]);

      const cap = (s) => {
        if(!s) return s;
        const low = s.toLowerCase();
        if(particles.has(low)) return low;
        return low.charAt(0).toUpperCase() + low.slice(1);
      };

      const capToken = (token) => {
        return token.split("-").map(seg => {
          if(seg.includes("'")){
            const [a,b=""] = seg.split("'");
            const left = cap(a);
            const right = b ? cap(b) : "";
            return right ? `${left}'${right}` : `${left}'`;
          }
          return cap(seg);
        }).join("-");
      };

      const firstNames = parts.map(capToken).join(" ");
      return `${firstNames} ${lastName}`;
    }

    function initData(){
      // reconstruit TOUJOURS depuis les données (mise à jour)
      const saved = safeStorage.get(STORAGE_KEY);
      let savedById = {};
      if(saved){
        try{
          const parsed = JSON.parse(saved);
          if(Array.isArray(parsed)){
            parsed.forEach(p => { if(p && p.displayId != null) savedById[p.displayId] = p.progress; });
          }
        }catch(e){}
      }

      projects = rawCSVData.map((item,index)=>({
        uid:index,
        displayId:item.id,
        axe:item.axe,
        theme:item.theme || "",
        title:item.title || "",
        desc:item.desc || "",
        pilot: formatName(item.pilot),
        progress: getProgressForId(item.id, savedById[item.id] ?? 0)
      }));

      safeStorage.set(STORAGE_KEY, JSON.stringify(projects));
    }

    function switchView(view){
      document.getElementById('view-grid').classList.toggle('hidden', view !== 'grid');
      document.getElementById('view-piste').classList.toggle('hidden', view !== 'piste');

      document.querySelectorAll('.main-nav-item').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${view}`).classList.add('active');
    }

    function filterByAxe(axe){
      filterAxe = axe;
      document.querySelectorAll('[data-axe]').forEach(btn => {
        const v = btn.dataset.axe;
        const isActive = (axe === 'all' && v === 'all') || (String(axe) === v);
        btn.classList.toggle('active', isActive);
      });
      filterAll();
    }

    function filterByTheme(theme){
      filterTheme = (filterTheme === theme) ? 'all' : theme;
      filterAll();
    }
    function clearThemeFilter(){
      filterTheme = 'all';
      filterAll();
    }
    function updateThemeChip(){
      const wrap = document.getElementById('activeThemeChipWrap');
      const txt = document.getElementById('activeThemeText');
      if(!wrap || !txt) return;

      if(filterTheme === 'all'){
        wrap.classList.add('hidden');
      }else{
        txt.textContent = filterTheme;
        wrap.classList.remove('hidden');
      }
    }

    function filterAll(){
      const input = document.getElementById('mainSearch');
      const search = (input ? input.value : "").toLowerCase();

      const filtered = projects.filter(p => {
        const mAxe = filterAxe === 'all' || p.axe == filterAxe;
        const mTheme = filterTheme === 'all' || (p.theme === filterTheme);

        const mSearch =
          (p.title || "").toLowerCase().includes(search) ||
          (p.pilot || "").toLowerCase().includes(search) ||
          (p.theme || "").toLowerCase().includes(search) ||
          (p.desc  || "").toLowerCase().includes(search);

        return mAxe && mTheme && mSearch;
      });

      updateThemeChip();
      renderGrid(filtered);
      renderPistes(filtered);
    }

    function renderGrid(data){
      const grid = document.getElementById('projectsGrid');

      grid.innerHTML = "";

        const themeEncoded = encodeURIComponent(p.theme || "");

        grid.innerHTML += `
          <div class="card" style="--axe:${color}" onclick="openModal(${p.uid})">
            <div class="flex justify-between items-center mb-3">
              <span class="axe-badge">${axeLabels[p.axe]}</span>
              <span class="meta-id">#${num}</span>
            </div>

            <button
              type="button"
              class="theme-label"
              onclick="event.stopPropagation(); filterByTheme(decodeURIComponent('${themeEncoded}'))"
              title="Filtrer sur cette thématique"
            >
              ${p.theme || ""}
            </button>

            <h3 class="text-[14px] font-black text-black leading-snug mb-4 title-clamp">${p.title}</h3>

            <div class="mt-auto pt-4 border-t border-[#efefef]">
              <div class="flex justify-between items-end mb-2">
                <span class="pilot-name truncate max-w-[70%]">${pilot}</span>
                <span class="text-[13px] font-black" style="color:${color}">${p.progress}%</span>
              </div>
              <div class="progress-track">

              </div>
            </div>
          </div>

      });
    }

    function renderPistes(data){

                <div class="absolute left-1/4 top-[62%] -translate-x-1/2">25%</div>

                <div class="absolute right-0 top-[62%] translate-x-1/2">100%</div>
              </div>

              <div id="track-${i}" class="relative w-full h-full z-10"></div>
            </div>
          </div>
        `;

        const track = document.getElementById(`track-${i}`);
        data.filter(p => p.axe === i).forEach(p => {
          const jitter = ((p.displayId * 13) % 40) - 20;
          const pion = document.createElement('div');

          pion.className = "absolute w-9 h-9 bg-white rounded-[10px] border-2 shadow-sm flex items-center justify-center cursor-pointer transition-transform hover:scale-[1.08] hover:z-50";
          pion.style.borderColor = color;
          pion.style.color = color;
          pion.style.left = `${p.progress}%`;
          pion.style.top = `calc(50% + ${jitter}px)`;
          pion.style.transform = "translate(-50%, -50%)";
          pion.style.fontSize = "11px";
          pion.style.fontWeight = "900";
          pion.innerText = p.displayId;

          pion.onmouseenter = () => { pion.style.background = color; pion.style.color = "white"; };
          pion.onmouseleave = () => { pion.style.background = "white"; pion.style.color = color; };
          pion.onclick = () => openModal(p.uid);

          track.appendChild(pion);
        });
      }
    }

    function openModal(uid){
      activeUid = uid;
      const p = projects.find(x => x.uid === uid);
      if(!p) return;

      const color = axeColors[p.axe] || "var(--maif-grey)";

      // 1) Numéro
      const num = String(p.displayId).padStart(2,'0');
      document.getElementById('mNum').textContent = `#${num}`;

      // 2) Préconisation (titre petit)
      document.getElementById('mTitle').textContent = p.title;

      // 3) Avancées (texte depuis le code)
      const advancesEl = document.getElementById('mAdvances');
      const advances = (getAdvancesForId(p.displayId) || "").trim();
      if(advances){
        advancesEl.textContent = advances;
        advancesEl.classList.remove('desc-placeholder');
      }else{
        advancesEl.textContent = "Avancées : à compléter";
        advancesEl.classList.add('desc-placeholder');
      }

      // 4) Progression
      const progressText = document.getElementById('mProgressText');
      progressText.textContent = `${p.progress}%`;
      progressText.style.color = color;

      const bar = document.getElementById('mProgressBar');
      bar.style.width = `${p.progress}%`;
      bar.style.background = color;

      const backdrop = document.getElementById('backdrop');
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeModal(){
      const backdrop = document.getElementById('backdrop');
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
    }

    function toggleSearch(force){
      const shell = document.getElementById('searchShell');
      const input = document.getElementById('mainSearch');
      const isOpen = shell.classList.contains('open');
      const shouldOpen = (force === true) || (force === undefined && !isOpen);

      if(shouldOpen){
        shell.classList.add('open');
        setTimeout(() => input && input.focus(), 0);
      }else{
        shell.classList.remove('open');
      }
    }

    window.onload = () => {
      initData();
      filterAll();

      document.addEventListener('keydown', (e) => {
        if(e.key === 'Escape') toggleSearch(false);
      });

      document.getElementById('backdrop').addEventListener('click', (e) => {
        if(e.target && e.target.id === 'backdrop') closeModal();
      });
    };
